<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #050507;
      color: #ffffff;
    }

    #gate *, #site *, #pw-modal * {
      border-radius: 0 !important;
    }

    .panel {
      background: linear-gradient(135deg, #0a1f5c 0%, #000000 50%, #0a1f5c 100%);
      border: 1px solid #c0c0c0;
    }

    .field {
      background: transparent;
      border: 1px solid #c0c0c0;
    }

    .sep {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(192, 192, 192, 0.5) 50%, transparent 100%);
    }

    .amt, .tab {
      background: transparent;
      border: 1px solid rgba(192, 192, 192, 0.4);
      color: #fff;
      transition: background 0.15s, border-color 0.15s;
    }

    .amt.active, .tab.active {
      background: rgba(192, 192, 192, 0.2);
    }

    .amt.active, .tab.active, .glow {
      border-color: #ffffff;
      box-shadow: 0 0 4px #ffffff, 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .icon {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body class="min-h-screen">

  <div id="gate" class="fixed inset-0 bg-black z-50 flex items-center justify-center p-4">
    <div class="panel p-6 w-full max-w-sm space-y-4 text-center">
      <h1 class="text-lg text-white tracking-wide">ADMIN</h1>
      <input id="pass" type="password" placeholder="Password" onkeydown="if (event.key === 'Enter') login()" class="field w-full text-base text-white p-3 focus:outline-none">
      <div id="gate-error" class="text-xs text-red-400 min-h-[1rem]"></div>
      <button onclick="login()" class="w-full py-3 bg-white text-black text-sm hover:bg-gray-200 active:scale-95 transition">Enter</button>
    </div>
  </div>

  <div id="site" class="hidden w-full p-4 pb-24">

    <div id="page-bar" class="hidden flex items-center space-x-3 mb-4">
      <button onclick="history.back()" class="panel w-10 h-10 flex items-center justify-center text-white hover:opacity-80 transition">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <h2 id="page-title" class="text-lg text-white"></h2>
      <div id="bar-users" class="hidden flex-1 relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 fill-current text-gray-400" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input id="q" type="text" autocapitalize="none" placeholder="Username or code" oninput="searchUsers()" class="field w-full text-base text-white p-2 pl-10 focus:outline-none">
      </div>
      <div id="bar-withdraw" class="hidden flex-1 relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 fill-current text-gray-400" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input id="wq" type="text" autocapitalize="none" placeholder="Username or ID" oninput="renderWithdraw()" class="field w-full text-base text-white p-2 pl-10 focus:outline-none">
      </div>
    </div>

    <div id="page-home" class="space-y-4">

      <div id="info-panel" class="panel overflow-hidden">
        <button onclick="toggleInfo()" class="w-full flex items-center justify-between px-4 py-3 text-white text-sm">
          <span>Admin Info</span>
          <svg id="info-arrow" class="w-5 h-5 fill-current transition-transform" viewBox="0 0 24 24">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
          </svg>
        </button>
        <div id="info" class="hidden px-4 pb-3 text-base text-white">
          <div class="sep"></div>
          <div class="flex justify-between items-center py-3">
            <span>Total USDT</span>
            <span id="i-usdt"></span>
          </div>
          <div class="sep"></div>
          <div class="flex justify-between items-center py-3">
            <span>Total One Coin</span>
            <span id="i-total"></span>
          </div>
          <div class="sep"></div>
          <div class="flex justify-between items-center py-3">
            <span>Value</span>
            <span id="i-value"></span>
          </div>
          <div class="sep"></div>
          <div class="flex justify-between items-center py-3">
            <span>One Coin Price</span>
            <span id="i-price"></span>
          </div>
          <div class="sep"></div>
          <div class="flex justify-between items-center py-3">
            <span>Total User 24H</span>
            <span id="i-users24"></span>
          </div>
          <div class="sep"></div>
          <div class="flex justify-between items-center py-3">
            <span>Total User</span>
            <span id="i-users"></span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-4 gap-2">
        <button onclick="openPage('users')" aria-label="User" class="panel aspect-square md:aspect-auto md:h-24 flex items-center justify-center hover:opacity-80 transition">
          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
          </svg>
        </button>
        <button onclick="openPage('withdraw')" aria-label="Withdraw" class="panel aspect-square md:aspect-auto md:h-24 flex items-center justify-center hover:opacity-80 transition">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="2" y="6" width="20" height="12" rx="1"/>
            <circle cx="12" cy="12" r="2.8"/>
            <path d="M5.5 9.5v.01M18.5 14.5v.01"/>
          </svg>
        </button>
        <button onclick="openPage('price')" aria-label="Price" class="panel aspect-square md:aspect-auto md:h-24 flex items-center justify-center hover:opacity-80 transition">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M3 3v18h18"/>
            <path d="M7 15l4-4 3 3 6-7"/>
            <path d="M15 7h5v5"/>
          </svg>
        </button>
        <button onclick="openPage('requests')" aria-label="Requests" class="panel aspect-square md:aspect-auto md:h-24 flex items-center justify-center hover:opacity-80 transition">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="5" y="4" width="14" height="17" rx="1"/>
            <path d="M9 4V2.5h6V4"/>
            <path d="M9 11h6M9 15h6"/>
          </svg>
        </button>
      </div>

      <div class="panel p-3 space-y-2">
        <input id="g-user" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Username or ID" oninput="userOnly(this)" class="field w-full text-base text-white p-3 focus:outline-none">
        <div class="grid grid-cols-4 gap-2">
          <button type="button" data-amt="100" onclick="pickAmount(100)" class="amt py-3 text-sm active:scale-95">100</button>
          <button type="button" data-amt="1000" onclick="pickAmount(1000)" class="amt py-3 text-sm active:scale-95">1,000</button>
          <button type="button" data-amt="10000" onclick="pickAmount(10000)" class="amt py-3 text-sm active:scale-95">10,000</button>
          <button type="button" data-amt="20000" onclick="pickAmount(20000)" class="amt py-3 text-sm active:scale-95">20,000</button>
        </div>
        <button onclick="grant()" class="w-full py-3 bg-blue-900 text-white text-sm hover:bg-blue-800 active:scale-95 transition" style="border:1px solid #c0c0c0">Activate</button>
      </div>

      <button onclick="wipeAll()" aria-label="Clear database" class="w-full py-3 flex items-center justify-center hover:opacity-80 transition" style="background:#8b0000;border:1px solid #c0c0c0">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M4 7h16"/>
          <path d="M9 7V4h6v3"/>
          <path d="M6 7l1 13h10l1-13"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
      </button>

    </div>

    <div id="page-users" class="hidden space-y-2">
      <div id="users-list" class="space-y-2"></div>
    </div>

    <div id="page-user" class="hidden panel p-4"></div>

    <div id="page-withdraw" class="hidden space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <button id="wt-pending" onclick="setWTab('pending')" class="tab py-3 text-sm">Pending</button>
        <button id="wt-approved" onclick="setWTab('approved')" class="tab py-3 text-sm">Approved</button>
      </div>
      <div id="withdraw-list" class="space-y-2"></div>
    </div>

    <div id="page-price" class="hidden panel p-3 space-y-2">
      <div class="flex justify-between text-sm">
        <span class="text-gray-300">One Coin Price</span>
        <span id="price-current" class="text-white"></span>
      </div>
      <input id="price-input" type="text" inputmode="decimal" placeholder="$" class="field w-full text-base text-white p-3 focus:outline-none">
      <button onclick="savePrice()" class="w-full py-3 bg-white text-black text-sm hover:bg-gray-200 active:scale-95 transition">Save</button>
    </div>

    <div id="page-requests" class="hidden space-y-2"></div>

  </div>

  <div id="msg" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 max-w-[90%] panel px-4 py-2 text-xs text-center z-[60]"></div>

  <div id="pw-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="panel p-4 w-full max-w-sm space-y-3">
      <div class="text-sm text-white">New password</div>
      <input id="pw-input" type="text" autocomplete="off" oninput="asciiOnly(this)" placeholder="New password" onkeydown="if (event.key === 'Enter') savePw()" class="field w-full text-base text-white p-3 focus:outline-none">
      <div class="flex space-x-2">
        <button onclick="closePwModal()" class="field flex-1 py-3 text-white text-sm hover:opacity-80 transition">Cancel</button>
        <button onclick="savePw()" class="flex-1 py-3 bg-white text-black text-sm hover:bg-gray-200 active:scale-95 transition">Save</button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = 'https://fdrrjbchooqlpijujaed.supabase.co';
    const SB_KEY = 'sb_publishable_XW3_8K4gpjX9ph02phJDqQ_RQCRBNNm';
    const PAGES = ['home', 'users', 'user', 'withdraw', 'price', 'requests'];
    const TITLES = { price: 'Price', requests: 'Requests' };
    let adminPass = '';
    let page = 'home';
    let price = 0;
    let amount = null;
    let searchTimer = null;
    let msgTimer = null;

    async function rpc(fn, args) {
      const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
        method: 'POST',
        headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(args)
      });
      const text = await res.text();
      const data = text ? JSON.parse(text) : null;
      if (!res.ok) throw new Error((data && data.message) || 'Request failed');
      return data;
    }

    function esc(v) {
      return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function asciiOnly(el) {
      el.value = el.value.replace(/[^!-~]/g, '');
    }

    // Only lowercase English letters and digits
    function userOnly(el) {
      el.value = el.value.replace(/[^a-z0-9]/g, '');
    }

    function pickAmount(v) {
      amount = v;
      document.querySelectorAll('.amt').forEach(b => b.classList.toggle('active', Number(b.dataset.amt) === v));
    }

    function show(text, ok) {
      const msg = document.getElementById('msg');
      clearTimeout(msgTimer);
      msg.innerText = text;
      msg.classList.toggle('hidden', !text);
      msg.classList.toggle('text-emerald-400', ok);
      msg.classList.toggle('text-red-400', !ok);
      if (text) msgTimer = setTimeout(() => msg.classList.add('hidden'), 4000);
    }

    function fmtTime(t) {
      return Number(t) > 0 ? new Date(Number(t) * 1000).toLocaleString() : '-';
    }

    function fmtPrice(n) {
      return `$${Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 6 })}`;
    }

    function fmtUsd(n) {
      return `$${Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function infoOpen() {
      return !document.getElementById('info').classList.contains('hidden');
    }

    function renderInfo(i) {
      price = Number(i.price);
      const total = Number(i.total_one);
      document.getElementById('i-total').innerText = total.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 9 });
      document.getElementById('i-usdt').innerText = fmtUsd(i.total_usdt ?? i.usdt ?? 0);
      document.getElementById('i-value').innerText = fmtUsd(total * price);
      document.getElementById('i-price').innerText = fmtPrice(price);
      document.getElementById('i-users').innerText = Number(i.users).toLocaleString();
      document.getElementById('i-users24').innerText = Number(i.users_24h).toLocaleString();
    }

    async function refreshInfo() {
      try {
        renderInfo(await rpc('oc_admin_info', { p_pass: adminPass }));
      } catch (e) {
        show(e.message, false);
      }
    }

    function toggleInfo() {
      const hidden = document.getElementById('info').classList.toggle('hidden');
      document.getElementById('info-panel').classList.toggle('glow', !hidden);
      document.getElementById('info-arrow').classList.toggle('rotate-180', !hidden);
      if (!hidden) refreshInfo();
    }

    function showPage(name) {
      page = name;
      PAGES.forEach(p => document.getElementById('page-' + p).classList.toggle('hidden', p !== name));
      document.getElementById('page-bar').classList.toggle('hidden', name === 'home');
      const title = TITLES[name] || '';
      const pt = document.getElementById('page-title');
      pt.innerText = title;
      pt.classList.toggle('hidden', !title);
      document.getElementById('bar-users').classList.toggle('hidden', name !== 'users');
      document.getElementById('bar-withdraw').classList.toggle('hidden', name !== 'withdraw');
      show('', true);
      if (name === 'home' && infoOpen()) refreshInfo();
      if (name === 'users') loadUsers();
      if (name === 'requests') loadRequests();
      if (name === 'withdraw') renderWithdraw();
      if (name === 'user') renderUser();
      if (name === 'price') document.getElementById('price-current').innerText = fmtPrice(price);
    }

    function openPage(name) {
      history.pushState({ page: name }, '');
      showPage(name);
    }

    window.addEventListener('popstate', e => showPage(e.state ? e.state.page : 'home'));

    setInterval(() => {
      if (adminPass && page === 'home' && infoOpen()) refreshInfo();
    }, 5000);

    async function login() {
      const pass = document.getElementById('pass').value;
      try {
        renderInfo(await rpc('oc_admin_info', { p_pass: pass }));
      } catch (e) {
        document.getElementById('gate-error').innerText = e.message;
        return;
      }
      adminPass = pass;
      document.getElementById('pass').value = '';
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('site').classList.remove('hidden');
      showPage('home');
    }

    function searchUsers() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadUsers, 300);
    }

    let usersCache = [];
    let currentUser = null;
    let wTab = 'pending';

    function userHtml(u, i) {
      return `<button onclick="openUser(${i})" class="panel w-full p-3 flex items-center justify-between text-sm text-white hover:opacity-80 transition"><span>${esc(u.username)}</span><span class="text-gray-400">${esc(u.code)}</span></button>`;
    }

    async function loadUsers() {
      try {
        const rows = await rpc('oc_admin_users', { p_pass: adminPass, p_q: document.getElementById('q').value });
        usersCache = rows;
        document.getElementById('users-list').innerHTML = rows.length
          ? rows.map(userHtml).join('')
          : '<div class="text-center text-gray-500 text-xs py-4">No users found.</div>';
      } catch (e) {
        show(e.message, false);
      }
    }

    function openUser(i) {
      currentUser = usersCache[i];
      if (!currentUser) return;
      openPage('user');
    }

    function renderUser() {
      const box = document.getElementById('page-user');
      const u = currentUser;
      if (!u) { box.innerHTML = ''; return; }
      const pencil = `<button onclick="openPwModal()" aria-label="Edit password" class="field w-8 h-8 flex items-center justify-center hover:opacity-80 transition"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>`;
      const row = (label, value, extra = '') => `<div class="flex justify-between items-center py-3 text-base text-white"><span>${label}</span><span class="flex items-center space-x-2 text-right break-all"><span>${value}</span>${extra}</span></div>`;
      const rows = [
        row('Total Withdraw', esc(fmtUsd(u.total_withdraw ?? u.withdrawn ?? 0))),
        row('Total USDT', esc(fmtUsd(u.total_usdt ?? u.usdt ?? 0))),
        row('Total One Coin', Number(u.one).toFixed(9)),
        row('Total One Point', Number(u.op).toLocaleString()),
        row('Invite Friend', esc(Number(u.invites ?? u.invited ?? 0).toLocaleString())),
        row('Mining', esc(u.mining ?? u.mining_speed ?? 0)),
        row('Wallet', ''),
        row('Username', esc(u.username)),
        row('ID', esc(u.id ?? u.code)),
        row('Password', esc(u.password), pencil)
      ];
      box.innerHTML = rows.join('<div class="sep"></div>');
    }

    function openPwModal() {
      const m = document.getElementById('pw-modal');
      const input = document.getElementById('pw-input');
      input.value = '';
      m.classList.remove('hidden');
      input.focus();
    }

    function closePwModal() {
      document.getElementById('pw-modal').classList.add('hidden');
    }

    async function savePw() {
      if (!currentUser) return;
      const value = document.getElementById('pw-input').value;
      try {
        await rpc('oc_admin_set_password', { p_pass: adminPass, p_user: currentUser.username, p_new: value });
      } catch (e) {
        show(e.message, false);
        return;
      }
      currentUser.password = value;
      closePwModal();
      renderUser();
      show(`Password changed for ${currentUser.username}`, true);
    }

    function setWTab(t) {
      wTab = t;
      renderWithdraw();
    }

    function renderWithdraw() {
      document.getElementById('wt-pending').classList.toggle('active', wTab === 'pending');
      document.getElementById('wt-approved').classList.toggle('active', wTab === 'approved');
      document.getElementById('withdraw-list').innerHTML = '<div class="text-center text-gray-500 text-xs py-4">No withdrawals yet.</div>';
    }

        function requestHtml(r) {
      const actions = r.status === 'pending'
        ? `<div class="flex space-x-2">
            <button onclick="decide('${esc(r.id)}', true)" class="py-2 px-3 bg-white text-black text-xs hover:bg-gray-200 active:scale-95 transition">Approve</button>
            <button onclick="decide('${esc(r.id)}', false)" class="field py-2 px-3 text-white text-xs hover:opacity-80 active:scale-95 transition">Reject</button>
          </div>`
        : '';
      return `<div class="panel p-3 flex items-center justify-between">
        <div>
          <div class="text-xs text-gray-400">#${esc(r.id)} · ${esc(r.status.toUpperCase())} · ${esc(fmtTime(r.created))}</div>
          <div class="text-sm text-white">${esc(r.username)}</div>
          <div class="text-xs text-amber-400">+${Number(r.amount).toLocaleString()} One Point</div>
        </div>
        ${actions}
      </div>`;
    }

    async function loadRequests() {
      try {
        const rows = await rpc('oc_admin_list', { p_pass: adminPass });
        document.getElementById('page-requests').innerHTML = rows.length
          ? rows.map(requestHtml).join('')
          : '<div class="text-center text-gray-500 text-xs py-4">No requests yet.</div>';
      } catch (e) {
        show(e.message, false);
      }
    }

    async function decide(id, ok) {
      try {
        await rpc('oc_admin_decide', { p_pass: adminPass, p_id: id, p_ok: ok });
      } catch (e) {
        show(e.message, false);
        return;
      }
      loadRequests();
    }

    async function savePrice() {
      const value = parseFloat(document.getElementById('price-input').value.replace(/[$,\s]/g, ''));
      try {
        price = Number(await rpc('oc_admin_set_price', { p_pass: adminPass, p_price: value }));
      } catch (e) {
        show(e.message, false);
        return;
      }
      document.getElementById('price-current').innerText = fmtPrice(price);
      show(`Price set to ${fmtPrice(price)}`, true);
    }

    async function grant() {
      if (!amount) {
        show('Select an amount', false);
        return;
      }
      try {
        const balance = await rpc('oc_admin_grant', {
          p_pass: adminPass,
          p_user: document.getElementById('g-user').value,
          p_amount: amount
        });
        show(`Activated. One Point balance: ${Number(balance).toLocaleString()}`, true);
      } catch (e) {
        show(e.message, false);
      }
    }

    async function wipeAll() {
      if (!confirm('Delete ALL data from the database? This cannot be undone.')) return;
      try {
        await rpc('oc_admin_wipe', { p_pass: adminPass });
      } catch (e) {
        show(e.message, false);
        return;
      }
      show('Database cleared', true);
      if (infoOpen()) refreshInfo();
    }
  </script>
</body>
</html>
